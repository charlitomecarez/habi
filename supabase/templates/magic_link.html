<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Your sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#F6F6F3;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F6F3;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
      <tr><td style="padding:0 4px 16px;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:bold;color:#0F766E;">my-app</td></tr>
      <tr><td style="background:#FFFFFF;border:1px solid #E3E5E0;border-radius:16px;padding:28px 24px;font-family:Arial,Helvetica,sans-serif;color:#1A1C1E;">
        <h1 style="margin:0 0 12px;font-size:22px;line-height:28px;color:#1A1C1E;">Your sign-in code</h1>
        <p style="margin:0 0 20px;font-size:16px;line-height:24px;color:#1A1C1E;">Enter this code in my-app to sign in.</p>
        <p style="margin:0 0 8px;font-size:13px;line-height:19px;color:#5B6168;">Sign-in code</p>
        <p style="margin:0 0 24px;font-size:32px;line-height:40px;letter-spacing:6px;font-weight:bold;color:#1A1C1E;background:#E6F2F0;border-radius:12px;padding:12px 16px;text-align:center;">{{ .Token }}</p>
        <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="background:#0F766E;border-radius:12px;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#FFFFFF;text-decoration:none;">Sign in with the link</a>
        </td></tr></table>
        <p style="margin:24px 0 0;font-size:13px;line-height:19px;color:#5B6168;">The code works for one hour. If you did not try to sign in, you can ignore this email.</p>
      </td></tr>
      <tr><td style="padding:16px 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#5B6168;">Sent by my-app to {{ .Email }}.</td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
