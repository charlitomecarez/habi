name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The route types are generated and ignored by git, and the type check needs them.
      - name: Generate route types
        run: npx expo customize tsconfig.json
      - run: npm run typecheck
      - run: npm run lint
      # The coverage gate: 80% of lines in lib/ and the shared Edge Function code. vitest.config.ts sets it.
      - run: npm run test:coverage
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # tsc skips supabase/functions. Each function has its own deno.json, as Supabase reads one file for each function.
      - name: Type check the Edge Functions
        run: |
          for config in supabase/functions/*/deno.json; do
            deno check --no-lock --config "$config" "$(dirname "$config")/index.ts"
          done

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
      # Placeholders: the export only needs the names. The page never reaches a real project.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Export the web app
        run: npx expo export --platform web
      - name: Check the bundle budget
        run: node scripts/bundle-size.mjs dist
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: lighthouse
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
      # The E2E account is a normal account that the admin adds. Its email and password live only here.
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ci-placeholder
    steps:
      - name: Skip without the E2E account
        if: env.E2E_EMAIL == ''
        run: echo "::notice::E2E skipped. Add E2E_EMAIL, E2E_PASSWORD, E2E_SUPABASE_URL and E2E_SUPABASE_ANON_KEY secrets."
      - uses: actions/checkout@v4
        if: env.E2E_EMAIL != ''
      - uses: actions/setup-node@v4
        if: env.E2E_EMAIL != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.E2E_EMAIL != ''
        run: npm ci
      - name: Export the web app
        if: env.E2E_EMAIL != ''
        run: npx expo export --platform web
      - name: Install Chromium
        if: env.E2E_EMAIL != ''
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        if: env.E2E_EMAIL != ''
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: test-results
          if-no-files-found: ignore
