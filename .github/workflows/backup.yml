# Daily encrypted database backup. docs/backup.md has the setup and the restore steps.
# Secrets: BACKUP_DB_URL (session pooler) and BACKUP_AGE_PUBLIC_KEY.
name: Database backup

on:
  schedule:
    # 3:10 AM in Manila. GitHub can delay a job that starts on the hour.
    - cron: "10 19 * * *"
  workflow_dispatch:
  # GitHub runs a schedule only from main, so a change to this file starts the job on its branch.
  push:
    paths:
      - .github/workflows/backup.yml

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
      BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
      RESTORE_URL: postgresql://postgres:restore-check@localhost:5432/postgres
    steps:
      - name: Install the Postgres 17 client and age
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17 age

      - name: Dump the database
        run: |
          umask 077
          /usr/lib/postgresql/17/bin/pg_dump "$BACKUP_DB_URL" --format=custom --no-owner --no-privileges --file=backup.dump
          echo "Dump size: $(du -h backup.dump | cut -f1)"

      - name: Restore into an empty Postgres and compare row counts
        run: |
          BIN=/usr/lib/postgresql/17/bin
          psql_q() { "$BIN/psql" "$1" -v ON_ERROR_STOP=1 -Atc "$2"; }
          for role in anon authenticated service_role; do psql_q "$RESTORE_URL" "create role $role"; done
          # Supabase extensions do not exist here, so their objects fail. The row counts below decide the result.
          "$BIN/pg_restore" --dbname="$RESTORE_URL" --schema=public --schema=auth --no-owner --no-privileges backup.dump 2>restore.log || true
          echo "Restore messages: $(wc -l < restore.log)"
          tables=$(psql_q "$BACKUP_DB_URL" "select tablename from pg_tables where schemaname = 'public' order by 1")
          bad=0; total=0
          for t in $tables; do
            live=$(psql_q "$BACKUP_DB_URL" "select count(*) from public.\"$t\"")
            copy=$(psql_q "$RESTORE_URL" "select count(*) from public.\"$t\"" 2>/dev/null || echo missing)
            total=$((total + 1))
            if [ "$live" != "$copy" ]; then echo "Row count differs: $t"; bad=$((bad + 1)); fi
          done
          echo "Tables checked: $total. Tables that differ: $bad."
          rm -f restore.log
          # A row written during the job can differ by a few, so a rerun settles a single mismatch.
          test "$bad" -eq 0

      - name: Encrypt the dump
        run: |
          age --recipient "$BACKUP_AGE_PUBLIC_KEY" --output "my-app-$(date -u +%F).dump.age" backup.dump
          shred -u backup.dump

      - name: Store the encrypted file for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: my-app-*.dump.age
          retention-days: 30
          if-no-files-found: error
