<!doctype html><html><head><meta charset=utf8><link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap" rel=stylesheet><style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;background:#F4F5F0;color:#15191A;font-family:Overpass,sans-serif;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.sign{background:#0A6B3D;color:#fff;margin:40px 12px 0;border-radius:14px;border:3px solid #fff;outline:2px solid #0A6B3D;padding:14px 16px}.d{font-size:13px;font-weight:600}.say{font-size:27px;line-height:1.1;font-weight:800;margin-top:6px}.arrow{font-size:22px;font-weight:900;float:right}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:12px 12px 0;border:2px solid #15191A;border-radius:10px;overflow:hidden;background:#fff}.strip div{padding:8px 10px;border-right:2px solid #15191A}.strip div:last-child{border:0}.strip b{display:block;font-size:20px;font-weight:900}.strip small{font-size:12px}
.road{flex:1;position:relative;margin:14px 12px 0;padding-left:64px;overflow:hidden}.road:before{content:"";position:absolute;left:24px;top:0;bottom:0;width:8px;background:#2B2F31}.road:after{content:"";position:absolute;left:27px;top:0;bottom:0;width:2px;background:repeating-linear-gradient(#F5C400 0 12px,transparent 12px 22px)}
.st{position:relative;padding:10px 0;border-bottom:1px solid #15191A22}.post{position:absolute;left:-64px;top:12px;width:56px;background:#fff;border:2px solid #15191A;border-radius:6px 6px 2px 2px;text-align:center;font-weight:900;font-size:15px;line-height:1.05;padding:5px 2px;z-index:2}.post small{display:block;font-size:9px;font-weight:600}.post.w{background:#F5C400}
.st b{font-size:16px;font-weight:800;display:block}.st small{font-size:13px;color:#4A5154}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:2px solid #15191A;font-size:11px;text-align:center;padding:8px 0 16px}.nav span{display:flex;flex-direction:column;gap:4px;align-items:center;color:#4A5154}.nav i{width:44px;height:26px;border-radius:13px;display:block;background:#E3E6DE}.nav .on{color:#0A6B3D;font-weight:800}.nav .on i{background:#0A6B3D}
</style></head><body><div class=sign><div class=d>Friday, Nov 6 <span class=arrow>↑</span></div><div class=say>Change the oil before Saturday</div></div>
<div class=strip><div><b>₱1,240</b><small>left this week</small></div><div><b>26°</b><small>Rain 40%</small></div><div><b>6,240</b><small>steps</small></div></div>
<div class=road><div class=st><div class="post w">10<small>AM</small></div><b>Pay electric bill</b><small>₱1,860 · Today</small></div><div class=st><div class=post>12<small>NOON</small></div><b>Ginisang munggo</b><small>₱78 · Today's ulam</small></div><div class=st><div class="post w">120<small>KM</small></div><b>Engine oil</b><small>ADV 160 · Due soon</small></div><div class=st><div class=post>9<small>PM</small></div><b>Journal</b><small>Evening review</small></div><div class=st><div class=post>SAT<small>NOV 7</small></div><b>Trip to Tagaytay</b><small>Rain 60%</small></div></div><nav class="nav"><span class="on"><i></i>Home</span><span><i></i>Money</span><span><i></i>Todos</span><span><i></i>Vehicle</span><span><i></i>More</span></nav></body></html>
