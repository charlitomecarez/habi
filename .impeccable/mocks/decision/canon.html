<!doctype html><html><head><meta charset=utf8><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel=stylesheet><style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;background:#F7FBF7;color:#191C1A;font-family:Roboto,sans-serif;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.top{padding:44px 16px 10px}.d{font-size:14px;color:#404943}.say{font-size:24px;line-height:1.2;font-weight:500;margin-top:4px}.body{flex:1;padding:0 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.card{background:#E7F0E9;border-radius:16px;padding:12px 14px}.card b{font-size:16px;font-weight:500;display:block}.card small{font-size:13px;color:#404943}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:28px;font-weight:500}.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:8px;background:#FFDEA8;color:#5E4100;margin-top:6px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:#ECF3ED;font-size:11px;text-align:center;padding:10px 0 16px;margin-top:10px}.nav span{display:flex;flex-direction:column;gap:4px;align-items:center;color:#404943}.nav i{width:56px;height:30px;border-radius:15px;display:block;background:transparent;border:1.5px solid #70797300}.nav .on{font-weight:700}.nav .on i{background:#B8ECC9}
</style></head><body><div class=top><div class=d>Friday, Nov 6</div><div class=say>Good morning, Charli</div></div><div class=body><div class=card><b>Change the oil before Saturday</b><small>Engine oil is due in 120 km</small><br><span class=chip>Due soon</span></div><div class=g><div class=card><small>Left this week</small><div class=big>₱1,240</div></div><div class=card><small>Weather</small><div class=big>26°</div><small>Rain 40%</small></div></div><div class=card><b>Pay electric bill</b><small>Today, 10:00 AM · ₱1,860</small></div><div class=card><b>Ginisang munggo</b><small>Today's ulam · ₱78</small></div><div class=card><b>6,240 steps</b><small>Slept 6 h 40 min</small></div></div><nav class="nav"><span class="on"><i></i>Home</span><span><i></i>Money</span><span><i></i>Todos</span><span><i></i>Vehicle</span><span><i></i>More</span></nav></body></html>
